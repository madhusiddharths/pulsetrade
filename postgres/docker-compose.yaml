services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrade-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pulsetrade
      POSTGRES_PASSWORD: pulsetrade_dev
      POSTGRES_DB: pulsetrade
    volumes:
      - pulsetrade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsetrade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulsetrade_pgdata:
