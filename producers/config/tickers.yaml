# PulseTrade — tickers to track
# Add or remove tickers without touching code.
# 5 tickers × 30s polling = 14,400 calls/day to Yahoo Finance, well below their soft limits.

tickers:
  - NVDA   # NVIDIA — high volatility, AI sector
  - AAPL   # Apple — large cap, stable
  - MSFT   # Microsoft — large cap tech
  - TSLA   # Tesla — high volatility, news-sensitive
  - GOOGL  # Alphabet — large cap tech

# Polling interval in seconds.
# Don't go below 15s — Yahoo Finance starts returning empties.
poll_interval_seconds: 30

# Kafka topic to produce to
kafka_topic: stock-prices
