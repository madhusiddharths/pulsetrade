# ─────────────────────────────────────────────────────────────────────────────
# API (FastAPI + co-located MCP subprocess, Option A). Deployment + Service.
# Env comes from TWO sources:
#   - envFrom configMapRef  → non-secret wiring (DB host, API URL)
#   - envFrom secretRef     → API keys (Gemini, Databricks, Tavily) from .env
# This is the K8s equivalent of compose's env_file + environment overrides.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulsetrade-config
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          # Liveness/readiness use the endpoints from Day 4. /ready checks
          # Databricks + Postgres reachability, so the pod won't take traffic
          # until its backends are reachable.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60      # give the app real time to settle before probing
            periodSeconds: 30
            timeoutSeconds: 15           # was default 1s — the cause of "context deadline exceeded"
            failureThreshold: 10          # tolerate transient slowness before killing
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10           # /ready hits Databricks — needs a generous timeout
            failureThreshold: 12         # tolerate the ~5min Databricks cold-start
---
# Service — stable DNS name `api`, port 8000. ClusterIP: internal-only for now.
# (Day 13 adds Ingress to expose it publicly; today we reach it via port-forward.)
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
