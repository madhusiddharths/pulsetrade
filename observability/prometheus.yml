# observability/prometheus.yml
#
# Tells Prometheus what to scrape and how often.

global:
  scrape_interval: 15s         # How often to poll /metrics
  evaluation_interval: 15s     # How often to check alerting rules (none yet)

scrape_configs:
  # Job: scrape our FastAPI agent service running on the host
  - job_name: "fastapi-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
        labels:
          # Adds 'service=agent' to every metric from this job —
          # useful when we add the MCP server and Streamlit later.
          service: "agent"
          env: "local"
  
  # Job: Prometheus scrapes itself — useful for health checks
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]